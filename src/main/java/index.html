<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login & Signup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-toggle {
            display: flex;
            gap: 0;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .toggle-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: #999;
            transition: all 0.3s ease;
            position: relative;
        }

        .toggle-btn.active {
            color: #667eea;
        }

        .toggle-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: #667eea;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.1);
        }

        input::placeholder {
            color: #999;
        }

        .error {
            color: #ff4757;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .remember-forgot a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .success.show {
            display: block;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
        }

        .checkbox-group input {
            width: auto;
            margin-right: 10px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-toggle">
            <button class="toggle-btn active" data-form="login">Login</button>
            <button class="toggle-btn" data-form="signup">Sign Up</button>
        </div>

        <div class="success" id="successMsg"></div>

        <!-- Login Form -->
        <form id="loginForm" class="form-section active">
            <h2>Student Login</h2>

            <div class="form-group">
                <label for="loginEmail">Email or Username</label>
                <input 
                    type="text" 
                    id="loginEmail" 
                    placeholder="Enter your email or username"
                    required
                >
                <div class="error" id="loginEmailError"></div>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input 
                    type="password" 
                    id="loginPassword" 
                    placeholder="Enter your password"
                    required
                >
                <div class="error" id="loginPasswordError"></div>
            </div>

            <div class="remember-forgot">
                <div class="checkbox-group">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Remember me</label>
                </div>
                <a href="#" onclick="alert('Password recovery feature coming soon'); return false;">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>
        </form>

        <!-- Sign Up Form -->
        <form id="signupForm" class="form-section">
            <h2>Student Sign Up</h2>

            <div class="form-group">
                <label for="signupName">Full Name</label>
                <input 
                    type="text" 
                    id="signupName" 
                    placeholder="Enter your full name"
                    required
                >
                <div class="error" id="signupNameError"></div>
            </div>

            <div class="form-group">
                <label for="signupEmail">Email Address</label>
                <input 
                    type="email" 
                    id="signupEmail" 
                    placeholder="Enter your email"
                    required
                >
                <div class="error" id="signupEmailError"></div>
            </div>

            <div class="form-group">
                <label for="signupRollNo">Roll Number (Optional)</label>
                <input 
                    type="text" 
                    id="signupRollNo" 
                    placeholder="Enter your roll number"
                >
            </div>

            <div class="form-group">
                <label for="signupDept">Department</label>
                <select id="signupDept" required>
                    <option value="">Select Department</option>
                    <option value="cse">Computer Science & Engineering</option>
                    <option value="ece">Electronics & Communication</option>
                    <option value="me">Mechanical Engineering</option>
                    <option value="ce">Civil Engineering</option>
                    <option value="ee">Electrical Engineering</option>
                </select>
                <div class="error" id="signupDeptError"></div>
            </div>

            <div class="form-group">
                <label for="signupPassword">Password</label>
                <input 
                    type="password" 
                    id="signupPassword" 
                    placeholder="Create a password (min 6 characters)"
                    required
                >
                <div class="error" id="signupPasswordError"></div>
            </div>

            <div class="form-group">
                <label for="signupConfirmPassword">Confirm Password</label>
                <input 
                    type="password" 
                    id="signupConfirmPassword" 
                    placeholder="Confirm your password"
                    required
                >
                <div class="error" id="signupConfirmPasswordError"></div>
            </div>

            <div class="checkbox-group" style="margin-bottom: 20px;">
                <input type="checkbox" id="agreeTerms" required>
                <label for="agreeTerms">I agree to the Terms and Conditions</label>
            </div>

            <button type="submit">Sign Up</button>
        </form>
    </div>

    <script>
        // Toggle between Login and Sign Up forms
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const formType = this.getAttribute('data-form');
                
                document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                document.querySelectorAll('.form-section').forEach(form => {
                    form.classList.remove('active');
                });
                
                if (formType === 'login') {
                    document.getElementById('loginForm').classList.add('active');
                } else {
                    document.getElementById('signupForm').classList.add('active');
                }
            });
        });

        // Login form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let isValid = true;
            document.querySelectorAll('#loginForm .error').forEach(err => err.classList.remove('show'));
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!email) {
                document.getElementById('loginEmailError').textContent = 'Email or username is required';
                document.getElementById('loginEmailError').classList.add('show');
                isValid = false;
            }
            
            if (!password) {
                document.getElementById('loginPasswordError').textContent = 'Password is required';
                document.getElementById('loginPasswordError').classList.add('show');
                isValid = false;
            }
            
            if (isValid) {
                showSuccess('Login successful! Redirecting...');
                console.log('Login attempt:', { email, rememberMe: document.getElementById('rememberMe').checked });
                setTimeout(() => this.reset(), 1500);
            }
        });

        // Sign Up form submission
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let isValid = true;
            document.querySelectorAll('#signupForm .error').forEach(err => err.classList.remove('show'));
            
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const dept = document.getElementById('signupDept').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            const agreeTerms = document.getElementById('agreeTerms').checked;
            
            // Name validation
            if (!name) {
                document.getElementById('signupNameError').textContent = 'Full name is required';
                document.getElementById('signupNameError').classList.add('show');
                isValid = false;
            }
            
            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email || !emailRegex.test(email)) {
                document.getElementById('signupEmailError').textContent = 'Valid email is required';
                document.getElementById('signupEmailError').classList.add('show');
                isValid = false;
            }
            
            // Department validation
            if (!dept) {
                document.getElementById('signupDeptError').textContent = 'Please select a department';
                document.getElementById('signupDeptError').classList.add('show');
                isValid = false;
            }
            
            // Password validation
            if (password.length < 6) {
                document.getElementById('signupPasswordError').textContent = 'Password must be at least 6 characters';
                document.getElementById('signupPasswordError').classList.add('show');
                isValid = false;
            }
            
            if (password !== confirmPassword) {
                document.getElementById('signupConfirmPasswordError').textContent = 'Passwords do not match';
                document.getElementById('signupConfirmPasswordError').classList.add('show');
                isValid = false;
            }
            
            if (!agreeTerms) {
                alert('Please agree to the Terms and Conditions');
                isValid = false;
            }
            
            if (isValid) {
                showSuccess('Account created successfully! Please log in.');
                console.log('Signup data:', { name, email, dept });
                setTimeout(() => this.reset(), 1500);
            }
        });

        function showSuccess(message) {
            const successDiv = document.getElementById('successMsg');
            successDiv.textContent = message;
            successDiv.classList.add('show');
            setTimeout(() => successDiv.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
